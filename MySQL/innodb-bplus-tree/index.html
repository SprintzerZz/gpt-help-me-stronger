:root {
  color-scheme: light;
  --bg: #f3eee4;
  --ink: #292923;
  --muted: #777267;
  --line: #ded5c7;
  --panel: #fbf8f1;
  --panel-soft: #eee8dc;
  --olive: #65745c;
  --olive-deep: #4a5842;
  --olive-soft: #e8ecdf;
  --terracotta: #c76c4e;
  --terracotta-soft: #f1e2d7;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}
header {
  padding: 28px max(20px, calc((100vw - 1320px) / 2));
  border-bottom: 1px solid #ded5c7;
  background: linear-gradient(120deg, #fbf8f1, #eee6d9);
  color: var(--ink);
}
header h1 {
  font-family: Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif;
  font-size: clamp(25px, 3.2vw, 38px);
  line-height: 1.25;
}
header p { color: #756c5b; }
.page-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 15px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.page-topline a {
  color: var(--olive-deep);
  text-decoration: none;
  letter-spacing: 0;
}
.page-topline a:hover { color: var(--terracotta); text-decoration: underline; }
.page-topline a:focus-visible, button:focus-visible {
  outline: 3px solid #c76c4e80;
  outline-offset: 3px;
}
.shell { max-width: 1480px; padding: 22px 24px 48px; }
.nav { gap: 9px; margin-bottom: 18px; }
.nav button {
  border-color: var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink);
  transition: background-color .16s ease, border-color .16s ease, transform .16s ease;
}
.nav button:hover { border-color: var(--olive); background: var(--olive-soft); }
.nav button.active {
  border-color: var(--olive-deep);
  background: var(--olive-deep);
  color: #fffaf1;
}
.layout {
  grid-template-columns: minmax(0, 1fr);
  gap: 20px;
}
.panel, .side {
  border-color: var(--line);
  border-radius: 16px;
  background: var(--panel);
  box-shadow: 0 8px 26px #382a170d;
}
.panel { padding: 20px; }
.side {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-areas:
    "title title"
    "sql sql"
    "summary summary"
    "step step"
    "points-heading note"
    "points note";
  gap: 12px 24px;
  align-items: start;
  padding: 22px;
}
.side h2 { grid-area: title; margin: 0; }
.side .sql { grid-area: sql; margin: 0; }
.side .explain { grid-area: summary; margin: 0; }
.side .stepbox { grid-area: step; margin: 0; }
.side h3 { grid-area: points-heading; margin: 0; }
.side ul { grid-area: points; margin: 0; }
.side .note { grid-area: note; margin: 0; }
.toolbar { gap: 9px; margin: 0 0 15px; }
.toolbar button, .toolbar select {
  border-color: var(--line);
  border-radius: 9px;
  background: var(--panel-soft);
  color: var(--ink);
}
.toolbar button:hover:not(:disabled), .toolbar select:hover { border-color: var(--olive); }
.toolbar button.primary {
  border-color: var(--terracotta-dark);
  background: var(--terracotta);
  color: #fffaf1;
}
.toolbar button.secondary { background: var(--panel-soft); color: var(--ink); }
.toolbar button:disabled { opacity: .48; }
.toolbar input[type="range"] { accent-color: var(--olive); }
.visual {
  border-color: var(--line);
  border-radius: 13px;
  background: var(--panel);
  overscroll-behavior-x: contain;
  scrollbar-color: #b7ad9d #eee8dc;
  scrollbar-width: thin;
}
.wide svg { min-width: 900px; }
.legend { gap: 10px 16px; margin-top: 12px; color: var(--muted); }
.diagram-hint { display: none; margin: 8px 2px 0; font-size: .75rem; color: var(--muted); }
.sql {
  border: 1px solid #3e3a32;
  border-radius: 10px;
  background: #292923;
  color: #f3eee4;
  overflow-wrap: anywhere;
}
.explain { color: #514d42; line-height: 1.7; }
.stepbox {
  border-color: #d7c6a9;
  border-radius: 11px;
  background: #f1e8d6;
}
.stephead { color: var(--terracotta-dark); }
.steptext { line-height: 1.65; }
.small, .footer { color: var(--muted); }
.side h2, .side h3 {
  color: var(--ink);
  font-family: Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif;
}
.side h2 { font-size: 1.2rem; }
.side li { padding-left: 2px; line-height: 1.65; }
.note {
  border-color: #d7c6a9;
  background: #f1e8d6;
  color: #514638;
  line-height: 1.65;
}
.kbd { border-color: var(--line); background: var(--panel-soft); }
.svgtitle { fill: var(--ink); font-family: Georgia, "Noto Serif SC", "Songti SC", serif; }
.svgsub, .tiny { fill: var(--muted); }
.page { fill: var(--olive-soft); stroke: var(--olive); }
.page.active { fill: #f6e8c9; stroke: var(--terracotta); }
.pagehead { fill: #dce5d5; stroke: var(--olive); }
.pagelabel, .bodytext { fill: #3e4938; }
.rec { fill: #f4f0e7; stroke: #bcb3a4; }
.rec.target { fill: #f4d8c8; stroke: var(--terracotta-dark); }
.rec-mini, .rec-val { fill: var(--ink); }
.type { fill: #f1e2d7; stroke: #c9957d; }
.blueptr {
  stroke: #292923;
  stroke-width: 2.2;
  stroke-linecap: round;
  fill: none;
}
.leaflink {
  stroke: #292923;
  stroke-width: 2.2;
  stroke-linecap: round;
  fill: none;
}
.blackptr {
  stroke: #292923;
  stroke-width: 2;
  stroke-linecap: round;
  fill: none;
}
.route {
  stroke: var(--terracotta-dark);
  stroke-width: 5;
  filter: drop-shadow(0 1px 1px #382a1740);
}
.callout { fill: var(--panel); stroke: #c9bdab; }
.levelband { fill: #eee8dc; stroke: #c9bdab; }
.levellabel { fill: var(--olive-deep); }
.page-row { fill: #e8ecdf; stroke: #9baa8e; }
.diagram-panel { fill: var(--panel); stroke: var(--line); }
[style*="#b8d3f8"] { background: #65745c !important; }
[style*="#fa8172"], [style*="#ef5548"] { background: #c76c4e !important; }
[style*="#e7f1e2"] { background: #e8ecdf !important; }
@media (max-width: 640px) {
  header { padding: 22px 18px; }
  header p { font-size: .9rem; }
  .shell { margin-top: 14px; padding: 0 12px 32px; }
  .nav { gap: 7px; }
  .nav button { padding: 9px 12px; font-size: .84rem; }
  .panel, .side { padding: 14px; }
  .toolbar { gap: 7px; }
  .toolbar button { padding: 8px 10px; font-size: .84rem; }
  .toolbar .small { flex-basis: 100%; }
  .wide svg { min-width: 820px; }
  .diagram-hint { display: block; }
  .side {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
      "title"
      "sql"
      "summary"
      "step"
      "points-heading"
      "points"
      "note";
    gap: 12px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
</style></head><body><header><div class="page-topline"><a href="../../index.html">← 学习资料索引</a><span>MYSQL · DATABASE</span></div><h1>InnoDB B+ 树 · 数据页 · 回表过程</h1><p>参考你上传的五张结构图，重画“页内部 → 页目录 → 三层 B+ 树 → 普通索引回表 → 联合索引回表”。点击下一步或自动播放，红色路径会逐步高亮。</p></header><main class="shell"><div class="nav" id="nav"></div><div class="layout"><section class="panel"><div class="toolbar" id="toolbar"></div><div class="visual wide" id="visual"></div><p class="diagram-hint">结构图支持横向滚动，拖动或使用 Shift + 鼠标滚轮查看完整内容。</p><div class="legend" id="legend"><span><b style="background:#292923"></b>树的父子指针</span><span><b style="background:#292923"></b>同层/叶子页双向链表</span><span><b style="background:#ef5548"></b>正在执行的查询路径</span><span><b style="background:#e7f1e2"></b>InnoDB 索引页（示意）</span></div><p class="footer">说明：用简化数据记录和页编号表现实际原理；并非真实页布局的逐字节复刻。页面记录、槽、目录指针和层级关系均用示意模型表达。</p></section><aside class="side"><h2 id="sideTitle"></h2><div class="sql" id="sql"></div><p class="explain" id="summary"></p><div class="stepbox"><div class="stephead" id="stepCounter"></div><div class="steptext" id="stepText"></div></div><h3>理解要点</h3><ul id="bullet"></ul><div class="note" id="note"></div></aside></div></main>
<script>
const NS='http://www.w3.org/2000/svg';
const topics=[{name:'① 数据页内部',sql:'InnoDB INDEX Page（默认 16 KiB）',summary:'从一页的物理区域读到页内查找：记录区保存按键值组织的记录，Page Directory 用 Slot 定位记录组。',bullets:['固定区域包括 38 Byte File Header、56 Byte Page Header、26 Byte Infimum/Supremum 与 8 Byte File Trailer；示意图不按比例绘制。','普通记录通过记录头中的 next_record 偏移形成逻辑单向链表，物理位置不必连续。','Infimum / Supremum 是边界伪记录，record_type 分别为 2 / 3；普通索引记录为 0，非叶子目录记录为 1。'],note:'Page Directory 位于页尾，每个 Slot 占 2 Byte，保存所属记录组末记录的页内偏移。页大小通常为 16 KiB（可配置）；记录增长会挤占 Free Space。',steps:['从 File Header 到 File Trailer 识别页内区域；图中区域高度仅为示意。','看 User Records：示意插入 8 条普通记录，记录按键值逻辑相连。','看 Page Directory：Slot 保存记录组末记录的位置，不是每条记录各有一个 Slot。','页内查找先二分 Slot，再沿目标记录组的链表顺序比较。']},
{name:'② Slot 页目录',sql:'SELECT * FROM t_user WHERE id = 6;',summary:'Page Directory 为一页中的记录分组建立 Slot。先在 Slot 上二分定位候选组，再沿组内记录链表查找 id=6。',bullets:['Infimum 的 record_type=2，Supremum 的 record_type=3，普通叶子记录的 record_type=0。','Slot 保存记录组末记录的页内偏移；示意中 Slot-2 指向 id=8，作为 id=5 至 id=8 这组记录的边界。','next_record 表示逻辑上的下一条记录，记录在页中的物理位置不一定相邻。'],note:'图中把 8 条普通记录简化为两个记录组，每组 4 条；实际分组由 n_owned 等信息维护，Slot 数量不会与记录数量一一对应。',steps:['在 Page Directory 的 Slot 数组上二分，选出覆盖目标键值的记录组。','Slot-2 指向该组末记录 id=8；id=6 落在 id=4 与 id=8 的范围内。','沿记录链从 id=5 开始比较，再到 id=6；不要把 Slot 指针和 next_record 链混为一谈。','命中后返回该叶子记录；若需行数据，聚簇索引叶子记录包含整行。']},
{name:'③ 三层 B+ 树',sql:'SELECT * FROM t_user WHERE id = 15;',summary:'聚簇索引由根页 page(38)、目录层 page(40)/page(32) 和叶子页 page(10)/page(26)/page(8)/page(21) 组成。查 id=15 时，路径为 38 → 40 → 26。',bullets:['根页与中间目录页的普通记录保存“分隔键 + 子页号”，record_type=1；如 5/26 表示按键值范围导航到 page(26)。','叶子页的普通记录 record_type=0；聚簇索引叶子记录保存主键和整行数据。','同一层的目录页和叶子页各自通过 FIL Header 的 Prev / Next 指针相连；这与父子页号指针是两种关系。'],note:'四个叶子页 page(10)、page(26)、page(8)、page(21) 都处于同一层。页间箭头表示导航或同层链接，均为示意，不表示磁盘物理相邻。',steps:['从根页 page(38) 开始，根据 id=15 选择目录记录 1/40，进入 page(40)。','在 page(40) 的索引记录中比较键值，选择 5/26，进入 page(26)。','在叶子页 page(26) 顺序定位普通记录 id=15。','命中聚簇索引叶子记录，得到完整行；同层 Prev / Next 链可用于叶子范围扫描。']},
{name:'④ 二级索引回表',sql:"SELECT * FROM t_user WHERE name = 'K';",summary:'先沿普通二级索引 idx_name 查到 (name=K, id=15)，再以 id=15 从聚簇索引 PRIMARY 中读取完整行，这两次查找发生在两棵独立的 B+ 树上。',bullets:['普通二级索引叶子记录包含索引列值与主键值，不包含其余行字段。','二级索引叶子命中 K 后，取出主键 id=15；再将 id=15 作为 PRIMARY 的查找键。','回表不是叶子页间的直接指针，而是从 PRIMARY 根页重新导航到对应叶子页。'],note:'如果查询所需列都由二级索引提供（例如 SELECT id,name），可能成为覆盖索引而无需回表；是否采用还由优化器决定。',steps:['在普通索引 idx_name 的根页按 name 范围选择目录分支。','进入目录页并继续按 name=K 导航。','在二级索引叶子页找到 (K,id=15)：这里得到的是主键，不是完整行。','取出 id=15，切换到另一棵 PRIMARY B+ 树。','从 PRIMARY 根页开始按 id=15 选择目录页。','到达 PRIMARY 叶子页并定位 id=15。','读取聚簇索引叶子中的完整行，完成回表。']},
{name:'⑤ 联合索引回表',sql:"SELECT * FROM t_user WHERE name = 'K' AND age = 96;",summary:'联合索引按 (name, age, 主键 id) 排序。先用 (K,96) 找到 id=15，再用主键 id 回到 PRIMARY 获取 SELECT * 的其他字段。',bullets:['联合二级索引叶子项包含 name、age 和主键 id，排序遵循联合索引列顺序及主键后缀。','WHERE 同时约束 name 与 age 时，可按联合索引的键顺序缩小查找范围。','叶子项虽包含 (K,96,15)，但 SELECT * 仍需要索引中没有的字段，因此必须回表。'],note:'若改为 SELECT name,age,id，且过滤与返回列均由该联合索引覆盖，则可能无需访问 PRIMARY（还取决于优化器选择）。',steps:['进入联合索引 idx_name_age 的根页。','按索引键顺序 (name=K, age=96) 选择目录分支。','在叶子 page(26) 命中 (K,96,id=15)。','取出主键 id=15，切换至 PRIMARY 索引。','从 PRIMARY 根页按 id=15 查找目录分支。','到达 PRIMARY 叶子页并定位 id=15。','读取完整行，完成查询。']}];
let tab=0,step=0,timer=null;
const $=x=>document.getElementById(x);
function stop(){if(timer){clearInterval(timer);timer=null}}
function e(tag,attrs={},children=''){let a=Object.entries(attrs).map(([k,v])=>`${k}="${String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"`).join(' ');return `<${tag} ${a}>${children}</${tag}>`}
function text(x,y,s,cls='bodytext',extra={}){return e('text',{x,y,class:cls,...extra},String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'))}
function rect(x,y,w,h,cls,extra={}){return e('rect',{x,y,width:w,height:h,rx:3,class:cls,...extra})}
function line(d,cls='blackptr',extra={}){return e('path',{d,class:cls,...extra})}
function markers(){return `<defs><marker id="mb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#292923"/></marker><marker id="mr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a74e37"/></marker><marker id="mk" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="#292923"/></marker></defs>`}
function svg(w,h,body){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="InnoDB 索引页与 B+ 树教学结构图">${markers()}${body}</svg>`}
// The page glyph contains a header and ordered records. type=1 directory pages, type=0 leaf data pages.
function page(x,y,w,h,label,vals,type=0,opt={}){
 const active=opt.active;const target=opt.target;
 let out=rect(x,y,w,h,'page'+(active?' active':''));out+=rect(x,y,w,31,'pagehead');out+=text(x+w/2,y+21,label,'pagelabel',{'text-anchor':'middle'});
 const pad=8,top=y+42;const n=vals.length+2;const recW=Math.min(46,(w-2*pad-5*(n-1))/n);let points=[];
 const items=[{k:'2',v:''},...vals.map(v=>({k:String(type),v:String(v)})),{k:'3',v:''}];
 const total=n*recW+(n-1)*5,ox=x+(w-total)/2;
 items.forEach((r,i)=>{
 const rx=ox+i*(recW+5);points.push(rx+recW/2);
 out+=rect(rx,top,recW,26,'type'+((target===i)?' target':''),target===i?{stroke:'#eb4b42','stroke-width':3}:{});
 out+=text(rx+recW/2,top+18,r.k,'rec-mini',{'text-anchor':'middle'});
 if(r.v){out+=rect(rx,top+27,recW,28,'rec'+((target===i)?' target':''));out+=text(rx+recW/2,top+46,r.v,'rec-val',{'text-anchor':'middle'})}
 if(i<n-1)out+=line(`M${rx+recW} ${top+13} H${ox+(i+1)*(recW+5)-1}`,'blackptr',{'marker-end':'url(#mk)'});
 });
 out+=text(x+8,y+h-8,type===1?'record_type=1 · 目录':'record_type=0 · 数据','tiny');
 return out;
}
function pageDetail(){let a='';
 a+=text(34,37,'一、16KB 索引页：物理布局（区域高度不按比例）','svgtitle');
 const x=80,y=70,w=440;const regions=[['File Header','38 Bytes',52,'#d8e6ff'],['Page Header','56 Bytes',61,'#f3d7df'],['Infimum + Supremum','26 Bytes',52,'#e1efd8'],['User Records','记录区（可变）',205,'#fbe6d7'],['Free Space','空闲区（可变）',125,'#fff7e9'],['Page Directory','2 Bytes / Slot',60,'#dfecfb'],['File Trailer','8 Bytes',44,'#a8c7f3']];let yy=y;const bounds=[];
 regions.forEach((r,i)=>{a+=rect(x,yy,w,r[2],'', {fill:r[3],stroke:'#9eb2c7','stroke-width':1.2});a+=text(x+19,yy+24,r[0],i===3?'pagelabel':'bodytext');a+=text(x+w-18,yy+24,r[1],'tiny',{'text-anchor':'end'});bounds.push(yy);yy+=r[2]});
 for(let i=0;i<8;i++){let ry=bounds[3]+30+i*21;a+=rect(x+20,ry,295,18,'page-row');a+=text(x+30,ry+13,`record-${i+1}`,'rec-mini');a+=text(x+305,ry+13,`id=${i+1} · type=0`,'tiny',{'text-anchor':'end'})}
 if(step>=1){a+=rect(x+12,bounds[3]+27,w-24,174,'',{fill:'none',stroke:'#ef5548','stroke-width':2.5,rx:6});}
 if(step>=2){let sy=bounds[5];['0 · Infimum','1 · id=4','2 · id=8','3 · Sup'].forEach((s,i)=>{a+=rect(x+14+i*103,sy+32,96,22,'',{fill:'#fff',stroke:'#4878aa'});a+=text(x+19+i*103,sy+47,s,'tiny')});}
 a+=text(590,90,'二、记录与页目录的关系','svgtitle');
 const rx=610, ry=129; a+=rect(rx,ry,360,380,'diagram-panel');a+=text(rx+18,ry+35,'有序用户记录（next_record）','bodytext');
 const recordPositions=[];for(let i=0;i<8;i++){let xx=rx+22+(i%4)*88, yy2=ry+65+Math.floor(i/4)*105;recordPositions.push({x:xx,y:yy2});a+=rect(xx,yy2,64,54,'rec'+((step>=1)?' target':''));a+=text(xx+32,yy2+21,'id='+String(i+1),'rec-val',{'text-anchor':'middle'});a+=text(xx+32,yy2+40,'type=0','tiny',{'text-anchor':'middle'})}for(let i=0;i<recordPositions.length;i++){if(i%4!==3){let p=recordPositions[i];a+=line(`M${p.x+64} ${p.y+25} H${p.x+87}`,'blackptr',{'marker-end':'url(#mk)'})}}
 for(let i=0;i<4;i++){let sx=rx+14+i*82;a+=text(sx+35,ry+301,`Slot-${i}`,'tiny',{'text-anchor':'middle'});a+=rect(sx,ry+311,72,42,'',{fill:'#f4dcd5',stroke:'#ad7f74'});a+=text(sx+36,ry+337,['Infimum','id=4','id=8','Supremum'][i],'tiny',{'text-anchor':'middle'})}if(step>=3)a+=line(`M${rx+165} ${ry+311} V${ry+148} L${rx+312} ${ry+127}`,'blackptr',{'marker-end':'url(#mk)'});
 a+=text(590,554,'Slot 通过页目录缩小搜索范围，记录仍靠链表顺序访问。','svgsub');
 return svg(1030,625,a);
}
function slotView(){let a=text(45,39,'页内查询：Page Directory 二分 + 记录链表遍历','svgtitle');let py=96;
 a+=rect(145,py,740,310,'page');a+=rect(145,py,740,45,'pagehead');a+=text(515,py+29,'page(10)   ·   聚簇索引叶子页','pagelabel',{'text-anchor':'middle'});
 let xs=[];for(let i=0;i<10;i++){let xx=183+i*67;xs.push(xx);a+=rect(xx,py+82,55,50,i===0||i===9?'type':'rec'+((step>=3&&i===6)?' target':''));a+=text(xx+27,py+110,i===0?'Inf':i===9?'Sup':String(i),'rec-mini',{'text-anchor':'middle'});if(i>0&&i<9)a+=text(xx+27,py+153,'id='+i,'rec-val',{'text-anchor':'middle'});if(i<9)a+=line(`M${xx+55} ${py+106} H${xs[i]+66}`,'blackptr',{'marker-end':'url(#mk)'})}
 a+=text(170,py+205,'Page Directory / Slots（保存组内末记录的偏移）','bodytext');const slotxs=[215,420,625]; ['Slot-1 → id=4','Slot-2 → id=8','Slot-3 → Sup'].forEach((v,i)=>{a+=rect(slotxs[i],py+220,176,52,'',{fill:step>=1&&i===1?'#ffe0b9':'#e1eefa',stroke:step>=1&&i===1?'#ef5548':'#8aacd1','stroke-width':step>=1&&i===1?2.8:1});a+=text(slotxs[i]+88,py+251,v,'bodytext',{'text-anchor':'middle'})});
 [4,8,9].forEach((v,i)=>a+=line(`M${slotxs[i]+88} ${py+220} Q${xs[v]+28} ${py+184} ${xs[v]+28} ${py+137}`,'blackptr',{'marker-end':'url(#mk)'}));
 if(step>=2)a+=line(`M${xs[5]+28} ${py+75} H${xs[6]+24}`,'route',{'marker-end':'url(#mr)'});
 a+=text(175,py+290,'※ 简化分组：真实 Infimum / Supremum 的分组规则由 n_owned 等页内结构维护。','tiny');
 a+=text(65,475,'页内查询过程','svgtitle'); const labels=['目录 Slot 二分','锁定所属记录组','组内顺序遍历','找到 id=6'];labels.forEach((v,i)=>{const xx=73+i*236;a+=rect(xx,504,208,63,'',{fill:step>=i?'#e6f5ee':'#f2f5f9',stroke:step>=i?'#51ac87':'#c6d5e4'});a+=text(xx+104,530,v,'bodytext',{'text-anchor':'middle'});a+=text(xx+104,550,step>=i?'已完成':'待执行','tiny',{'text-anchor':'middle'});if(i<3)a+=line(`M${xx+208} 536 H${xx+232}`,'blueptr',{'marker-end':'url(#mb)'})});return svg(1030,610,a)}
// A whole 3 level tree; coordinates scaled to space.
function tree(x,y,wscale=1,leafType=0,opts={}){
 let s='';const xx=n=>x+n*wscale;const yy=n=>y+n;const W=220*wscale,H=126;
 const root={x:xx(390),y:yy(0)},middle=[{x:xx(150),y:yy(200)},{x:xx(635),y:yy(200)}];
 const leaves=[{x:xx(20),y:yy(430),k:'page(10)',v:leafType===0?['1','2','4']:['A:2','B:10','D:66']},{x:xx(265),y:yy(430),k:'page(26)',v:leafType===0?['5','12','15']:['F:26','K:15','M:55']},{x:xx(510),y:yy(430),k:'page(8)',v:leafType===0?['21','22','25']:['N:5','O:12','P:21']},{x:xx(755),y:yy(430),k:'page(21)',v:leafType===0?['35','55','61']:['R:35','T:61','Z:2']}];
 const leafW=195*wscale,midW=245*wscale,rootW=245*wscale;
 // lines behind nodes
 middle.forEach((m,i)=>{s+=line(`M${root.x+rootW/2} ${root.y+H} L${m.x+midW/2} ${m.y-1}`,'blueptr',{'marker-end':'url(#mb)'})});
 const pairs=[[0,1,2],[3]];pairs.forEach((ary,j)=>ary.forEach(k=>{let m=middle[j],l=leaves[k];s+=line(`M${m.x+midW/2} ${m.y+H} L${l.x+leafW/2} ${l.y-1}`,'blueptr',{'marker-end':'url(#mb)'})}));
 const middleLinkY=middle[0].y+78;s+=line(`M${middle[0].x+midW} ${middleLinkY-8} H${middle[1].x-1}`,'leaflink',{'marker-end':'url(#mb)'});s+=line(`M${middle[1].x} ${middleLinkY+8} H${middle[0].x+midW+1}`,'leaflink',{'marker-end':'url(#mb)'});
 for(let i=0;i<leaves.length-1;i++){let l=leaves[i],r=leaves[i+1];let ylink=l.y+78; s+=line(`M${l.x+leafW} ${ylink-10} H${r.x-1}`,'leaflink',{'marker-end':'url(#mb)'});s+=line(`M${r.x} ${ylink+10} H${l.x+leafW+1}`,'leaflink',{'marker-end':'url(#mb)'})}
 s+=page(root.x,root.y,rootW,H,'page(38)',leafType===0?['1/40','35/32']:['A/40','R/32'],1,{active:opts.active?.includes('root')});
 middle.forEach((m,i)=>{s+=page(m.x,m.y,midW,H,i===0?'page(40)':'page(32)',leafType===0?(i===0?['1/10','5/26','21/8']:['35/21']):(i===0?['A/10','F/26','N/8']:['R/21']),1,{active:opts.active?.includes(i===0?'middle':'othermiddle')})});
 leaves.forEach((l,i)=>{s+=page(l.x,l.y,leafW,H,l.k,l.v,0,{active:opts.active?.includes('leaf'+i),target:i===1&&opts.active?.includes('record')?3:-1})});
 if(opts.active?.includes('root'))s+=rect(root.x-5,root.y-5,rootW+10,H+10,'',{fill:'none',stroke:'#ef5548','stroke-width':2.4,rx:8});
 if(opts.active?.includes('route1'))s+=line(`M${root.x+rootW/2} ${root.y+H} L${middle[0].x+midW/2} ${middle[0].y-1}`,'route',{'marker-end':'url(#mr)'});
 if(opts.active?.includes('route2'))s+=line(`M${middle[0].x+midW/2} ${middle[0].y+H} L${leaves[1].x+leafW/2} ${leaves[1].y-1}`,'route',{'marker-end':'url(#mr)'});
 return s;
}
function treeView(){let a=text(40,40,'三层聚簇索引 PRIMARY：根页 → 目录页 → 数据页','svgtitle');a+=rect(10,62,1000,180,'levelband');a+=rect(10,258,1000,185,'levelband');a+=rect(10,458,1000,218,'levelband');a+=text(25,85,'根目录层 · record_type=1','levellabel');a+=text(25,285,'中间目录层 · record_type=1','levellabel');a+=text(25,485,'叶子数据层 · record_type=0','levellabel');let active=[];if(step>=0)active.push('root');if(step>=1)active.push('middle','route1');if(step>=2)active.push('leaf1','route2');if(step>=3)active.push('record');a+=tree(12,104,.97,0,{active});a+=text(40,700,'黑色实线箭头：父页指向子页与叶子页双向链接  ·  红色虚线：当前查询路径','svgsub');return svg(1030,730,a)}
function smallTree(x,y,kind,progress,variant){let a='';const rootX=x+190,rootY=y+30,middleX=x+115,middleY=y+220,leafX=x+98,leafY=y+410;
 a+=line(`M${rootX+55} ${rootY+126} L${middleX+110} ${middleY-1}`,'blueptr',{'marker-end':'url(#mb)'});
 a+=line(`M${middleX+110} ${middleY+126} L${leafX+115} ${leafY-1}`,'blueptr',{'marker-end':'url(#mb)'});
 a+=page(rootX,rootY,145,126,'page(38)',kind==='primary'?['1/40','35/32']:variant.joint===true?['A/40','R/32']:['A/40','R/32'],1,{active:progress>=1});
 a+=page(middleX,middleY,233,126,'page(40)',kind==='primary'?['1/10','5/26','21/8']:['A/10','F/26','N/8'],1,{active:progress>=2});
 a+=page(leafX,leafY,270,126,'page(26)',kind==='primary'?['5','12','15']:variant.joint===true?['F,73,26','K,96,15','M,55,4']:['F,26','K,15','M,55'],0,{active:progress>=3,target:progress>=3?2:-1});
 if(progress>=2)a+=line(`M${rootX+55} ${rootY+126} L${middleX+110} ${middleY-1}`,'route',{'marker-end':'url(#mr)'});
 if(progress>=3)a+=line(`M${middleX+110} ${middleY+126} L${leafX+115} ${leafY-1}`,'route',{'marker-end':'url(#mr)'});
 a+=text(x+30,y+12,kind==='primary'?'聚簇索引 PRIMARY':'二级索引 '+(variant.joint===true?'idx_name_age':'idx_name'),'svgtitle');
 a+=text(x+30,y+565,kind==='primary'?'叶子节点：主键 → 完整行':'叶子节点：索引字段 → 主键 id','svgsub');
 return a;
}
function backView(joint=false){let a='';a+=rect(10,52,497,620,'diagram-panel');a+=rect(522,52,498,620,'diagram-panel');
 const leftProg=step>=0?(step===0?1:step===1?2:3):0; const rightProg=step>=4?step===4?1:step===5?2:3:0;
 a+=smallTree(30,75,'secondary',leftProg,{joint});a+=smallTree(542,75,'primary',rightProg,{joint});
 if(step>=3){a+=line('M400 535 C520 500 540 330 690 170','route',{'marker-end':'url(#mr)'});a+=rect(448,320,150,46,'',{fill:'#fff2e8',stroke:'#a74e37','stroke-width':2.5});a+=text(523,349,'id = 15 → 回表','pagelabel',{'text-anchor':'middle'});}
 a+=text(40,40,joint?'联合索引 (name, age) → 主键索引的两棵 B+ 树':'普通索引 (name) → 主键索引的两棵 B+ 树','svgtitle');
 a+=text(36,700,joint?'查到 (K,96,id=15)，但 SELECT * 仍需要聚簇索引中的其他列。':'查到 (K,id=15)，但 SELECT * 需要完整行，因此进入 PRIMARY 再查一次。','svgsub');
 a+=text(36,728,'红色虚线路径为跨树回表；图示是逻辑查找过程，不代表物理文件之间的直连指针。','svgsub');return svg(1030,760,a)}
function render(){let t=topics[tab];$('nav').innerHTML=topics.map((x,i)=>`<button data-i="${i}" class="${i===tab?'active':''}">${x.name}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{stop();tab=+b.dataset.i;step=0;render()});
 $('sideTitle').textContent=t.name;$('sql').textContent=t.sql;$('summary').textContent=t.summary;$('bullet').innerHTML=t.bullets.map(x=>`<li>${x}</li>`).join('');$('note').textContent=t.note;
 $('stepCounter').textContent=`步骤 ${step+1} / ${t.steps.length}`;$('stepText').textContent=t.steps[step];
 $('toolbar').innerHTML=`<button id="prev" ${step===0?'disabled':''}>◀ 上一步</button><button id="next" class="primary" ${step===t.steps.length-1?'disabled':''}>下一步 ▶</button><button id="autoplay" class="secondary">${timer?'■ 停止播放':'▶ 自动播放'}</button><button id="restart">↺ 重置</button><span class="small">选择章节，逐步高亮 B+ 树路径</span>`;
 $('prev').onclick=()=>{stop();step=Math.max(0,step-1);render()};$('next').onclick=()=>{stop();step=Math.min(t.steps.length-1,step+1);render()};$('restart').onclick=()=>{stop();step=0;render()};$('autoplay').onclick=()=>{if(timer){stop();render();return}if(step===t.steps.length-1)step=0;timer=setInterval(()=>{if(step<t.steps.length-1){step++;render()}else{stop();render()}},1350);render()};
 $('visual').innerHTML=tab===0?pageDetail():tab===1?slotView():tab===2?treeView():backView(tab===4);
}
render();
</script></body></html>
