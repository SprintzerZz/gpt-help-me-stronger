<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GPT 生成的 HTML 交互教学网页目录">
  <title>交互学习资料目录</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #edf2ff;
      background: #080b14;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #929bb3;
      --line: rgb(166 179 219 / 13%);
      --accent: #85f3df;
      --accent-blue: #8ca7ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: #080b14;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% -23%, rgb(91 106 255 / 22%), transparent 58%),
        radial-gradient(ellipse at 4% 72%, rgb(33 212 197 / 8%), transparent 35%),
        #080b14;
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      background-image: linear-gradient(rgb(165 181 255 / 3%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(165 181 255 / 3%) 1px, transparent 1px);
      background-size: 52px 52px;
      content: "";
      mask-image: linear-gradient(to bottom, rgb(0 0 0 / 80%), transparent 82%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 1032px);
      margin: 0 auto;
      padding: 32px 32px 36px;
    }

    .topbar,
    .brand,
    .status,
    .catalog-heading,
    .card,
    .card-copy,
    footer {
      display: flex;
      align-items: center;
    }

    .topbar,
    .catalog-heading,
    footer {
      justify-content: space-between;
    }

    .topbar {
      min-height: 44px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      gap: 11px;
      color: #f0f3ff;
      font-size: 0.9rem;
      font-weight: 720;
      letter-spacing: 0.025em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgb(133 243 223 / 35%);
      border-radius: 11px;
      background: linear-gradient(145deg, rgb(133 243 223 / 17%), rgb(140 167 255 / 13%));
      color: var(--accent);
      box-shadow: 0 0 26px rgb(82 239 223 / 10%);
    }

    .brand-mark svg {
      width: 19px;
      height: 19px;
    }

    .status {
      gap: 9px;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgb(133 243 223 / 80%);
    }

    .hero {
      padding: 54px 0 46px;
      text-align: center;
    }

    .intro {
      margin: 0 0 29px;
      color: #929bb3;
      font-size: 0.98rem;
      line-height: 1.8;
    }

    .search {
      position: relative;
      width: min(100%, 570px);
      margin: 0 auto;
      text-align: left;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 18px;
      width: 19px;
      height: 19px;
      color: #818ca9;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .search input {
      width: 100%;
      min-height: 58px;
      padding: 0 20px 0 49px;
      border: 1px solid rgb(170 183 222 / 20%);
      border-radius: 15px;
      background: rgb(18 23 38 / 88%);
      color: #f0f3ff;
      font: inherit;
      font-size: 0.94rem;
      box-shadow: 0 14px 40px rgb(0 0 0 / 22%), inset 0 1px rgb(255 255 255 / 3%);
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .search input::placeholder {
      color: #78839d;
    }

    .search input:focus {
      border-color: rgb(133 243 223 / 65%);
      outline: none;
      background: #121827;
      box-shadow: 0 0 0 4px rgb(133 243 223 / 9%), 0 14px 44px rgb(0 0 0 / 25%);
    }

    .search input::-webkit-search-cancel-button {
      cursor: pointer;
    }

    .results-count {
      margin: 10px 0 0;
      color: #77819a;
      font-size: 0.8rem;
      text-align: center;
    }

    .catalog {
      width: min(100%, 740px);
      margin: 0 auto;
      padding: 26px 0 38px;
    }

    .catalog-heading {
      gap: 16px;
      margin-bottom: 17px;
    }

    h2 {
      margin: 0;
      color: #eef1ff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.015em;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-symbol {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid rgb(140 167 255 / 24%);
      border-radius: 9px;
      background: rgb(140 167 255 / 10%);
      color: #aebeff;
      font-size: 0.78rem;
      font-weight: 750;
    }

    .section-caption {
      color: #747f99;
      font-size: 0.76rem;
    }

    .resource-section {
      margin-bottom: 0;
    }

    .card {
      position: relative;
      min-height: 130px;
      justify-content: space-between;
      gap: 22px;
      overflow: hidden;
      padding: 22px 24px;
      border: 1px solid rgb(164 178 219 / 15%);
      border-radius: 17px;
      background: linear-gradient(112deg, rgb(20 27 44 / 97%), rgb(14 19 32 / 96%));
      color: #eef2ff;
      text-decoration: none;
      box-shadow: 0 16px 42px rgb(0 0 0 / 20%), inset 0 1px rgb(255 255 255 / 3%);
      transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      background: linear-gradient(180deg, #85f3df, #829bff);
      content: "";
      opacity: 0.8;
    }

    .card::after {
      position: absolute;
      top: -90px;
      right: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgb(115 142 255 / 12%), transparent 68%);
      content: "";
      pointer-events: none;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-3px);
      border-color: rgb(133 243 223 / 45%);
      box-shadow: 0 19px 48px rgb(0 0 0 / 30%), 0 0 30px rgb(80 207 201 / 6%);
    }

    .card:focus-visible {
      outline: 3px solid rgb(133 243 223 / 65%);
      outline-offset: 4px;
    }

    .card-copy {
      position: relative;
      z-index: 1;
      min-width: 0;
      gap: 18px;
    }

    .category {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 11px;
      padding: 5px 10px;
      border: 1px solid rgb(133 243 223 / 18%);
      border-radius: 999px;
      background: rgb(133 243 223 / 7%);
      color: #9cf0df;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.025em;
    }

    .category-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #85f3df;
      box-shadow: 0 0 8px rgb(133 243 223 / 75%);
    }

    .title {
      display: block;
      color: #f1f3ff;
      font-size: 1.13rem;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    .description {
      display: block;
      margin-top: 7px;
      color: #8c96af;
      font-size: 0.88rem;
      line-height: 1.65;
    }

    .arrow {
      position: relative;
      z-index: 1;
      display: grid;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgb(162 177 222 / 17%);
      border-radius: 13px;
      background: rgb(255 255 255 / 3%);
      color: #aebeff;
      font-size: 1.2rem;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .card:hover .arrow {
      transform: translateX(3px);
      border-color: rgb(133 243 223 / 35%);
      background: rgb(133 243 223 / 10%);
      color: var(--accent);
    }

    .empty-state {
      padding: 32px 24px;
      border: 1px dashed rgb(164 178 219 / 24%);
      border-radius: 16px;
      color: #9ba5bd;
      text-align: center;
    }

    .empty-state[hidden],
    .resource-section[hidden] {
      display: none;
    }

    footer {
      gap: 14px;
      width: min(100%, 740px);
      margin: 0 auto;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: #77819a;
      font-size: 0.78rem;
    }

    .footer-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .footer-icon {
      color: #8496c9;
    }

    @media (max-width: 520px) {
      main {
        padding: 20px 18px 28px;
      }

      .hero {
        padding: 42px 0 36px;
      }

      .intro {
        font-size: 0.9rem;
      }

      .catalog {
        padding: 22px 0 32px;
      }

      .card {
        min-height: 112px;
        gap: 13px;
        padding: 18px;
      }

      .card-copy {
        gap: 0;
      }

      .card-icon {
        display: none;
      }

      .title {
        font-size: 1rem;
      }

      .description {
        font-size: 0.82rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (min-width: 521px) {
      .card-icon {
        display: grid;
        flex: 0 0 auto;
        width: 68px;
        height: 68px;
        place-items: center;
        border: 1px solid rgb(140 167 255 / 20%);
        border-radius: 18px;
        background: linear-gradient(145deg, rgb(140 167 255 / 11%), rgb(133 243 223 / 7%));
        color: #c3ccff;
      }

      .card-icon svg {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 6.5h14M5 12h9M5 17.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <circle cx="18" cy="16.5" r="2.5" stroke="currentColor" stroke-width="1.6"></circle>
          </svg>
        </span>
        <span>INTERACTIVE LAB</span>
      </div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span>学习资料库</div>
    </header>

    <section class="hero" aria-label="搜索学习资料">
      <p class="intro">交互式教学内容，把复杂概念变成直观体验。<br>搜索主题，开启你的下一段探索。</p>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <label class="visually-hidden" for="resource-search">搜索学习资料</label>
        <input id="resource-search" type="search" placeholder="搜索课程、主题或关键词…" autocomplete="off">
      </div>
      <p class="results-count" id="results-count" aria-live="polite"></p>
    </section>

    <section class="catalog" aria-label="学习资料列表">
      <div class="catalog-heading">
        <div class="section-label">
          <span class="section-symbol" aria-hidden="true">01</span>
          <h2>课程目录</h2>
        </div>
        <span class="section-caption">LEARNING PATHS</span>
      </div>

      <section class="resource-section" aria-labelledby="mysql-heading">
        <h2 class="visually-hidden" id="mysql-heading">MySQL</h2>
        <a class="card" href="MySQL/sql-joins/" data-search="mysql sql joins join 数据库 关联 查询">
          <span class="card-copy">
            <span class="card-icon" aria-hidden="true">
              <svg viewBox="0 0 40 40" fill="none">
                <circle cx="15" cy="20" r="10" stroke="currentColor" stroke-width="1.7"></circle>
                <circle cx="25" cy="20" r="10" stroke="#85f3df" stroke-width="1.7"></circle>
                <path d="M20 11.4a10 10 0 0 1 0 17.2 10 10 0 0 1 0-17.2Z" fill="rgb(133 243 223 / 18%)"></path>
                <text x="11.7" y="22.4" fill="currentColor" font-size="7" font-weight="700">A</text>
                <text x="25.2" y="22.4" fill="#85f3df" font-size="7" font-weight="700">B</text>
              </svg>
            </span>
            <span>
              <span class="category"><span class="category-dot" aria-hidden="true"></span>MYSQL · DATABASE</span>
              <span class="title">SQL JOIN 交互式学习</span>
              <span class="description">通过交互示例探索 JOIN 匹配规则、SQL 写法与查询结果。</span>
            </span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </section>
      <p class="empty-state" id="empty-state" role="status" hidden>没有找到匹配的学习资料，试试其他关键词。</p>
    </section>

    <footer>
      <span class="footer-note"><span class="footer-icon" aria-hidden="true">✦</span>持续更新</span>
    </footer>
  </main>
  <script>
    const searchInput = document.querySelector("#resource-search");
    const resultCount = document.querySelector("#results-count");
    const emptyState = document.querySelector("#empty-state");
    const sections = [...document.querySelectorAll(".resource-section")];
    const resources = [...document.querySelectorAll(".card")].map((card) => ({
      card,
      section: card.closest(".resource-section"),
      searchableText: `${card.textContent} ${card.dataset.search}`.toLocaleLowerCase()
    }));

    function updateResults() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      let visibleCount = 0;

      for (const resource of resources) {
        const isVisible = resource.searchableText.includes(query);
        resource.card.hidden = !isVisible;
        visibleCount += Number(isVisible);
      }

      for (const section of sections) {
        section.hidden = !section.querySelector(".card:not([hidden])");
      }

      resultCount.textContent = query
        ? `找到 ${visibleCount} 个学习页面`
        : `共 ${visibleCount} 个学习页面`;
      emptyState.hidden = visibleCount > 0;
    }

    searchInput.addEventListener("input", updateResults);
    updateResults();
  </script>
</body>
</html>
