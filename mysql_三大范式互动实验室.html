<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MySQL 三大范式互动实验室</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#19283c;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:30px 18px}.app{max-width:1000px;margin:auto;background:#fff;border:1px solid #dde5ef;border-radius:20px;padding:28px;box-shadow:0 15px 45px #1d3b5b10}h1{font-size:27px;margin:0 0 8px}h2{font-size:20px;margin:4px 0 10px}.sub,.explain{color:#607086;line-height:1.75}.sub{margin:0 0 24px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}button{font:inherit;cursor:pointer;border:1px solid #d7e0ec;border-radius:10px;padding:10px 15px;background:#fff;color:#27364a;font-weight:600}button:hover{border-color:#3979e5}button.active,.primary{color:#fff;background:#2463d4;border-color:#2463d4}button:disabled{opacity:.4;cursor:default}.panel{border:1px solid #dbe3ee;border-radius:12px;padding:15px;margin:12px 0}.label{font-size:14px;font-weight:700;margin-bottom:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e8edf4;white-space:nowrap}th{background:#f3f6fb}tr:last-child td{border-bottom:0}.bad{background:#ffe4df;color:#af3623;border-radius:5px;padding:3px 5px}.result{padding:13px 16px;border-left:4px solid #3878e5;border-radius:8px;background:#eff5ff;line-height:1.7;margin:14px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.controls{margin:16px 0}.small{font-size:13px}.center{text-align:center}.question-option{display:block;width:100%;text-align:left;margin:9px 0}.question-option.correct{background:#dcf5e8;border-color:#27a46c}.question-option.wrong{background:#ffe8e5;border-color:#d34b40}.nav{display:flex;justify-content:space-between;margin-top:20px}.progress{height:8px;background:#e9edf4;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#2463d4;transition:width .25s}@media(max-width:650px){body{padding:10px}.app{padding:17px}.two,.three{grid-template-columns:1fr}h1{font-size:22px}button{padding:9px 11px}}
</style>
</head>
<body>
<main class="app"><h1>🗃️ MySQL 三大范式互动实验室</h1><p class="sub">点击规范化拆表，观察 1NF、2NF、3NF 的区别；再体验订单反范式设计并完成面试小测。本文件可离线打开。</p><nav class="tabs" id="tabs"><button data-tab="0" class="active">① 第一范式</button><button data-tab="1">② 第二范式</button><button data-tab="2">③ 第三范式</button><button data-tab="3">④ 反范式优化</button><button data-tab="4">⑤ 面试小测</button></nav><section id="content" aria-live="polite"></section></main>
<script>
(()=>{
const root=document.querySelector('#content');let tab=0,normalized=false,quizIndex=0,answers={};
const table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const panel=(title,body)=>`<div class="panel"><div class="label">${title}</div>${body}</div>`;
const note=t=>`<div class="result">${t}</div>`;
const cases=[
{title:'第一范式（1NF）：字段具有原子性',intro:'学生选课表：一个字段塞入多门独立课程。',why:'选修课程字段包含多个独立课程值，筛选、维护不方便。',before:()=>panel('❌ 原始设计',table(['学号','姓名','选修课程'],[['1001','张三','<span class="bad">Java, MySQL</span>'],['1002','李四','<span class="bad">Java, Redis</span>']])),after:()=>panel('✅ 符合 1NF',table(['学号','姓名','选修课程'],[['1001','张三','Java'],['1001','张三','MySQL'],['1002','李四','Java'],['1002','李四','Redis']])),detail:'字段的原子性取决于业务需求。完整日期或地址不一定要机械拆分。'},
{title:'第二范式（2NF）：消除部分依赖',intro:'选课表组合主键为（学号，课程编号）。',why:'学生姓名只依赖学号，课程名称只依赖课程编号，不依赖完整组合键。',before:()=>panel('❌ 存在部分依赖',table(['学号 🔑','课程编号 🔑','学生姓名','课程名称','成绩'],[['1001','C01','<span class="bad">张三</span>','<span class="bad">Java</span>','90'],['1001','C02','<span class="bad">张三</span>','<span class="bad">MySQL</span>','85'],['1002','C01','李四','Java','88']])),after:()=>`<div class="two">${panel('学生表',table(['学号 🔑','姓名'],[['1001','张三'],['1002','李四']]))}${panel('课程表',table(['课程编号 🔑','课程名称'],[['C01','Java'],['C02','MySQL']]))}</div>${panel('选课表',table(['学号 🔑','课程编号 🔑','成绩'],[['1001','C01','90'],['1001','C02','85'],['1002','C01','88']]))}`,detail:'2NF：满足 1NF，且非主属性完全依赖候选键，不能仅依赖组合键的一部分。'},
{title:'第三范式（3NF）：消除传递依赖',intro:'学号确定班级编号，班级编号确定班级名称。',why:'学号 → 班级编号 → 班级名称：班级名称通过另一个非主属性间接依赖学号。',before:()=>panel('❌ 存在传递依赖',table(['学号 🔑','姓名','班级编号','班级名称'],[['1001','张三','B01','<span class="bad">软件一班</span>'],['1002','李四','B01','<span class="bad">软件一班</span>'],['1003','王五','B02','网络二班']])),after:()=>`<div class="two">${panel('学生表',table(['学号 🔑','姓名','班级编号'],[['1001','张三','B01'],['1002','李四','B01'],['1003','王五','B02']]))}${panel('班级表',table(['班级编号 🔑','班级名称'],[['B01','软件一班'],['B02','网络二班']]))}</div>`,detail:'3NF：满足 2NF，且不存在不符合 3NF 要求的非主属性传递依赖。班级改名只需要修改班级表。'}
];
function render(){document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('active',+b.dataset.tab===tab);b.setAttribute('aria-pressed',String(+b.dataset.tab===tab))});if(tab<=2){let c=cases[tab];root.innerHTML=`<h2>${c.title}</h2><p class="explain">${c.intro}</p>${note('<b>问题：</b>'+c.why)}${normalized?c.after():c.before()}<div class="controls"><button class="primary" id="toggle">${normalized?'↩ 恢复原始设计':'✦ 点击规范化拆表'}</button></div><p class="explain small">${c.detail}</p>`;root.querySelector('#toggle').onclick=()=>{normalized=!normalized;render()}}else if(tab===3){renderDenorm()}else{renderQuiz()}}
function renderDenorm(){root.innerHTML=`<h2>反范式：用适当冗余减少 JOIN</h2><p class="explain">场景：电商订单详情需要展示用户姓名、商品名称和购买价格。切换设计比较数据读取方式。</p><div class="tabs"><button data-mode="0" class="${!normalized?'active':''}">规范化设计</button><button data-mode="1" class="${normalized?'active':''}">反范式设计</button></div><div id="demo"></div>`;root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{normalized=b.dataset.mode==='1';renderDenorm()});root.querySelector('#demo').innerHTML=!normalized?`<div class="three">${panel('用户表',table(['id','姓名'],[['1','张三']]))}${panel('商品表',table(['id','名称'],[['10','机械键盘']]))}${panel('订单表',table(['id','user_id','product_id'],[['101','1','10']]))}</div><p class="center"><b>订单表 → JOIN 用户表 → JOIN 商品表</b></p>${note('优点：信息集中管理，减少重复。代价：跨表展示可能需要 JOIN，开销受数据量、索引和执行计划影响。')}`:`${panel('订单表：包含下单时快照',table(['订单ID','用户ID','用户姓名','商品ID','商品名称','成交单价'],[['101','1','<span class="bad">张三</span>','10','<span class="bad">机械键盘</span>','¥80']]))}<p class="center"><b>订单表 → 直接读取展示字段</b></p>${note('优点：部分查询无需 JOIN，并保留历史快照。代价：多占存储、增加维护规则。购买时成交价格是独立历史事实，不能简单等同于商品表当前价格的冗余。')}`}
const qs=[{q:'学生表的选修课程字段保存“Java, MySQL”，属于什么问题？',options:['违反 1NF：字段保存多个独立值','违反 2NF：部分依赖','违反 3NF：传递依赖'],ans:0,why:'一个字段包含多个独立课程值，违反此业务下的 1NF。'},{q:'选课表组合主键（学号，课程编号），学生姓名只由学号决定，违反哪一范式？',options:['1NF','2NF','3NF'],ans:1,why:'非主属性只依赖组合键的一部分，属于部分依赖。'},{q:'学号 → 班级编号 → 班级名称，班级名称为非主属性，这属于？',options:['原子性问题','部分依赖问题','传递依赖问题'],ans:2,why:'班级名称通过班级编号间接依赖学号。'},{q:'订单列表高频展示商品名称，哪种做法更合理？',options:['完全不能冗余字段','适度保存商品名称历史快照','必须删除商品表'],ans:1,why:'适当冗余商品名称快照，可减少部分 JOIN 并保留历史信息。'}];
function renderQuiz(){const q=qs[quizIndex],selected=answers[quizIndex],correct=Object.keys(answers).filter(i=>answers[i]===qs[i].ans).length;root.innerHTML=`<h2>面试小测</h2><p class="explain">第 ${quizIndex+1} / ${qs.length} 题 · 已答对 ${correct} 题</p><div class="progress"><div style="width:${(quizIndex+1)/qs.length*100}%"></div></div>${panel(q.q,q.options.map((o,i)=>`<button class="question-option ${selected!==undefined?(i===q.ans?'correct':i===selected?'wrong':''):''}" data-answer="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join(''))}${selected!==undefined?note(`<b>${selected===q.ans?'✓ 回答正确':'✗ 回答错误'}</b> ${q.why}`):'<p class="explain">点击选项查看解释。</p>'}<div class="nav"><button id="prev" ${quizIndex===0?'disabled':''}>上一题</button><button class="primary" id="next">${quizIndex===qs.length-1?'重新练习':'下一题 →'}</button></div>`;root.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[quizIndex]=+b.dataset.answer;renderQuiz()});root.querySelector('#prev').onclick=()=>{quizIndex--;renderQuiz()};root.querySelector('#next').onclick=()=>{if(quizIndex===qs.length-1){quizIndex=0;answers={}}else quizIndex++;renderQuiz()}}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;normalized=false;render()});render();
})();
</script>
</body>
</html>
